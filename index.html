<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勤怠システム</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
</head>

<body class="main">
    <header>
        <h1>勤怠管理</h1>
        <div class="head-status">
            <p>氏名：〇〇〇〇</p>
            <button class="m-button">ログアウト</button>
        </div>
    </header>
    <hr>
    <main>
        <div class="time-space">
            <div id="date"></div>
            <div id="clock"></div>
            <script>
                function updateDate() {
                    const now = new Date();

                    document.getElementById("date").textContent =
                        now.toLocaleDateString("ja-JP", {
                            timeZone: "Asia/Tokyo",
                            year: "numeric",
                            month: "numeric",
                            day: "numeric"
                        }).replace(/\//g, "年").replace(/(\d+)$/, "$1日");
                }
                function updateClock() {
                    const now = new Date();

                    document.getElementById("clock").textContent =
                        now.toLocaleTimeString("ja-JP", {
                            timeZone: "Asia/Tokyo",
                            hour: "2-digit",
                            minute: "2-digit",
                            second: "2-digit"
                        });
                }

                setInterval(updateDate, 1000);
                updateDate();
                setInterval(updateClock, 1000);
                updateClock();
            </script>
        </div>
        <div class="today-clock-inout">
            <div class="clock-in-time">
                <p>出勤時間</p>
                <time datetime="yy:mm">09:00</time>
            </div>
            <div class="clock-out-time">
                <p>退勤時間</p>
                <time datetime="yy:mm">-</time>
            </div>
            <div class="kyuukei-time">
                <p>休憩時間</p>
                <time datetime="yy:mm">-</time>
            </div>
        </div>
        <div class="button-field">
            <div class="clock-in">
                <button class="l-button">出勤</button>
            </div>
            <div class="clock-out">
                <button class="l-button">退勤</button>
            </div>
        </div>
        <div class="button-field">
            <div class="break-in">
                <button class="l-button">休憩開始</button>
            </div>
            <div class="break-out">
                <button class="l-button">休憩終了</button>
            </div>
        </div>
        <div class="button-field">
            <button class="l-button" onclick="openWindow()">本日分残業申請</button>
        </div>
    </main>

    <div class="window">
        <button onclick="closeWindow()">×</button>
        <h2>残業申請</h2>
    </div>
    <script>
        function openWindow() {
            document.getElementById("window").style.display = "block";
        }

        function closeWindow() {
            document.getElementById("window").style.display = "none";
        }
    </script>
</body>

</html>
