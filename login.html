<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勤怠システム | ログイン</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login">
    <header>
        <h1>勤怠管理</h1>
    </header>
    <hr>
    <main>
        <h1>ログイン</h1>
        <p>IDとパスワードを入力してください</p>

        <form action="post">
            <div>
                <p>ID</p>
                <input type="text" name="id" placeholder="2026xxx">
            </div>
            <div>
                <p>パスワード</p>
                <input type="text" name="pw">
            </div>
            <input type="submit" value="ログイン">
        </form>
    </main>
</body>

</html>
