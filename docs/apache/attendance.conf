# 勤怠管理システム（/var/www/html/attendance）用の Apache 設定
#
# 配置先: /etc/apache2/conf-available/attendance.conf （手順は docs/Apache設定手順書.md）
#
# リポジトリ直下が Web ルートのため、内部のコードや Git の管理ファイルが
# Web から見えないようにする。.htaccess は使わず（AllowOverride None のまま）、
# このファイルで設定する。

<Directory /var/www/html/attendance>
    # ディレクトリの一覧表示を無効にする
    Options -Indexes
    # .htaccess は使わない
    AllowOverride None
    Require all granted
</Directory>

# 内部のコード・テスト・Git・ドキュメント・DB 関連には、Web からアクセスさせない
<DirectoryMatch "^/var/www/html/attendance/(src|templates|tests|vendor|docs|db|\.git)(/|$)">
    Require all denied
</DirectoryMatch>

# 隠しファイル（.gitignore、.env など）と、設定・SQL・ドキュメント等の拡張子
<FilesMatch "^\.|\.(sql|md|json|lock|ini|log|sh|sample)$|^composer\.">
    Require all denied
</FilesMatch>
